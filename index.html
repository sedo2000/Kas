<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الاختبارات الأكاديمية — أسواق المال (المرحلة الثالثة)</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      (function() {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();  // إخبار تيليجرام أن الموقع جاهز لإخفاء شاشة التحميل
          tg.expand(); // فتح التطبيق بكامل الشاشة لراحة الطالب
          
          // حفظ بيانات الطالب في الـ sessionStorage لكي تقرأها في React بسهولة
          if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            sessionStorage.setItem('tg_user', JSON.stringify(tg.initDataUnsafe.user));
          }
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
